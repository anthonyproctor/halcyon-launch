<g class="grow"><rect x="240" y="260" width="200" height="18" rx="9" fill="#e0b25c"/><rect x="400" y="292" width="260" height="18" rx="9" fill="#2d6b7a"/><rect x="620" y="324" width="180" height="18" rx="9" fill="#c0473b"/><rect x="760" y="292" width="200" height="18" rx="9" fill="#8dbcd4"/></g>
