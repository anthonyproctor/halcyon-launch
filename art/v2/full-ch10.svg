.trace{stroke-dasharray:900;animation:trace 7s ease-out infinite}@keyframes trace{0%{stroke-dashoffset:900}55%,100%{stroke-dashoffset:0}}
}</style><defs><linearGradient id="night10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1018"/><stop offset="0.7" stop-color="#1c2a3a"/><stop offset="1" stop-color="#2a3a48"/></linearGradient></defs><rect width="1200" height="480" fill="#0a1018"/><rect width="1200" height="480" fill="url(#night10)"/>
