}</style><defs><linearGradient id="sea11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1724"/><stop offset="0.6" stop-color="#16243a"/><stop offset="1" stop-color="#0a1220"/></linearGradient><radialGradient id="lamp11"><stop offset="0" stop-color="#f6d48a" stop-opacity="0.28"/><stop offset="1" stop-color="#f6d48a" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="480" fill="#2a2f38"/><rect width="1200" height="480" fill="#2a2f38"/>
