}</style><defs><linearGradient id="yard1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1822"/><stop offset="1" stop-color="#1b2834"/></linearGradient><linearGradient id="tab1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22405a"/><stop offset="1" stop-color="#16303f"/></linearGradient></defs><rect width="1200" height="480" fill="#22303d"/><rect width="1200" height="300" fill="#22303d"/><rect y="300" width="1200" height="180" fill="#1a242e"/>
