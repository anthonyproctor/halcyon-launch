<style>
/* Layout: a book page for the story, a slim instrument rail for the meters. Reading first, UI second. */
:root{
  --bg:#f3f1ec; --page:#fbfaf7; --ink:#1d2024; --muted:#5d636b; --line:#dcd8cf; --soft:#ece9e2;
  --accent:#28536b; --accent-soft:#e1ebf0; --on-accent:#ffffff;
  --good:#2e7350; --good-soft:#e2f0e7; --mid:#9a6a12; --mid-soft:#f6ecd8; --bad:#a63c32; --bad-soft:#f5e1de;
  --mid-ink:#835a0e; --bubble:#2569c9; --on-bubble:#ffffff; /* text colors that hold 4.5:1: the "Partial" pill on --mid-soft, white on a text bubble */
  --story:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Inter Tight",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c;
  --mid-ink:#e0b25c; --bubble:#2563c4; --on-bubble:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c;
  --mid-ink:#e0b25c; --bubble:#2563c4; --on-bubble:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:1060px;margin:0 auto;padding-inline:18px;padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.page{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:28px clamp(18px,4vw,44px) 30px;min-width:0}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--story);font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
h2{font-family:var(--story);font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.2;margin:4px 0 14px;text-wrap:balance}
.story{font-family:var(--story);font-size:clamp(18px,2.1vw,20px);line-height:1.62;max-width:64ch}
.story p{margin:0 0 14px}
.story .said{font-style:italic}
.choices{display:grid;gap:10px;margin:20px 0 6px}
.choice{font:inherit;text-align:left;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.choice.best{border-color:var(--good)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outcome{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.verdict{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px;margin-bottom:10px}
.v3{color:var(--good);background:var(--good-soft)} .v1{color:var(--mid-ink);background:var(--mid-soft)} .v0{color:var(--bad);background:var(--bad-soft)}
.mentor{background:var(--soft);border-radius:8px;padding:14px 16px;margin:14px 0}
.mentor .who{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mentor .story{font-size:17.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.tag.dom{color:var(--accent);border-color:var(--accent)}
.tag.pre{color:var(--accent);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:7px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:13px;padding:6px 11px;font-weight:500}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px;min-width:0}
/* the side rail scrolls on its own when it's taller than the window (desktop only; the 860px rule below makes it static) */
.rail{max-height:calc(100vh - env(safe-area-inset-top,0px) - 32px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;align-content:start}
body:has(#narbar:not([hidden])) .rail{padding-bottom:var(--narbar-h,112px)}
.card{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.meter{margin-bottom:11px}
.meter .row{display:flex;justify-content:space-between;font-size:14px}
.meter .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.track span{display:block;height:100%;border-radius:4px}
/* book progress (2026-10-12): the rail card, the Library card bar, the Progress page finish line. Fill is --accent on --soft (3:1 or better as a graphic in both themes); text is --ink */
.bpbar{display:block;height:8px;background:var(--soft);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bpbar span{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:0}
.bpbar.thin{height:6px}
.bookbar{padding:12px 14px}.bookbar h3{margin-bottom:8px}
.bpline{margin:7px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.libbp{display:grid;gap:3px;margin-top:4px;max-width:280px}.libbp .prog{color:var(--ink)}
.bpline .bpp{white-space:nowrap}
h2.finishh{margin-top:18px}
.finish{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px;counter-reset:fin}
.finish li{counter-increment:fin;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.finish li::before{content:counter(fin);grid-row:1 / span 2;align-self:start;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line);color:var(--ink)}
.finish li.now::before{border-color:var(--accent);color:var(--accent)}
.finish li.done::before{content:"✓";background:var(--good-soft);border-color:var(--good);color:var(--good)}
.finish .fh{font-weight:600}.finish .fv{color:var(--ink)}
.finish .bpbar{grid-column:2;margin-top:6px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.dom-row:last-child{border-bottom:none}
.prog{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dot{width:14px;height:6px;border-radius:3px;background:var(--soft)}
.dot.s3{background:var(--good)} .dot.s1{background:var(--mid)} .dot.s0{background:var(--bad)} .dot.now{background:var(--accent)}
.cast dt{font-weight:600;font-size:14px;margin-top:8px}
.cast dd{margin:0;font-size:13.5px;color:var(--muted)}
.end-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.end-grid .card{padding:12px}
.big{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums}
.auth{max-width:420px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);margin-bottom:12px}
.auth input{font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.auth .err{color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:8px 11px;font-size:14px;margin-bottom:12px}
.userbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px}
.linkbtn{font:inherit;font-size:13.5px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;min-height:24px;min-width:24px;text-decoration:underline}
.plan{padding-left:20px;font-size:16px}.plan li{margin:8px 0}
.btn.small{font-size:13px;padding:5px 10px;margin-left:6px}
.helpcard{margin:10px 0}.helpcard .row{display:flex;justify-content:space-between;gap:8px}
.taskgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.taskcell{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;font-size:13px;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.taskcell .tc{font-family:var(--mono);font-size:12px;color:var(--accent)}.taskcell .tn{font-weight:500;min-height:2.6em}
.mbar{display:block;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:2px 0}.mbar span{display:block;height:100%}
#narfollow{position:absolute;left:50%;transform:translateX(-50%);top:-46px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}#narfollow[hidden]{display:none}
#narbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--page);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}
.narseekrow{display:flex;align-items:center;gap:10px;max-width:1060px;margin:8px auto 6px}.narseekrow input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}.nartime{font-family:var(--mono);font-size:13px;min-width:44px;text-align:center}
.contents{margin:6px 0 14px}.contents>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.secs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}.secs li{margin:0}
.sec,.bsec{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;min-height:36px;align-items:center}
.sec:hover:not(:disabled),.bsec:hover{background:var(--line)}.sec.now{font-weight:600;background:var(--line)}.sec.now .prog{color:var(--ink)}.sec:disabled{color:var(--muted);cursor:default;opacity:.7}
.railsecs{margin:2px 0 8px 18px;border-left:2px solid var(--line);padding-left:6px}.railsecs .sec{font-size:13px;padding:5px 6px;min-height:30px}
.chmap li{padding:0}.phbtn{font:inherit;color:inherit;background:none;border:0;padding:0;min-height:24px;cursor:pointer;text-transform:inherit;letter-spacing:inherit}.phbtn:disabled{cursor:default}
/* Audiobook follow-along (2026-10-12): the text being read, with the current word highlighted (engine.js bfBuild), and scene ticks on the seek bar */
.narseekwrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}.narseekwrap input[type=range]{width:100%}
.narticks{position:absolute;left:0;right:0;top:-20px;height:24px;pointer-events:none;display:none}#narbar.book .narticks{display:block}#narbar.book .narseekrow{margin-top:26px}
#narticks .ntick{position:absolute;top:0;width:24px;height:24px;margin-left:-12px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto}
.ntick i{position:absolute;left:11px;bottom:1px;width:2px;height:13px;background:var(--muted);border-radius:1px}.ntick:hover i,.ntick:focus-visible i{background:var(--accent);width:3px;left:10.5px;height:17px}
.narbubble{position:absolute;bottom:calc(100% + 24px);transform:translateX(-50%);white-space:nowrap;font:600 13px/1.2 var(--mono);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:5px 8px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none;z-index:2}.narbubble[hidden]{display:none}
.bfollow{margin:6px 0 18px;scroll-margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--page);overflow:hidden}
.bfhead{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--soft)}.bfhead b{display:block;font-size:15px;line-height:1.35}.bfhead .prog{color:var(--ink)}
.bftext{max-height:min(600px,calc(100vh - 300px));max-height:min(600px,calc(100dvh - 300px));min-height:220px;overflow-y:auto;padding:12px 16px 4px;max-width:none;font-size:18px;overflow-wrap:anywhere}.bftext:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bftext .bfp{cursor:pointer;border-radius:6px;margin:0 -6px 12px;padding:2px 6px}@media (hover:hover){.bfp:hover{background:var(--soft)}}
.bfp.les,.bfp.deb{border-left:3px solid var(--line);border-radius:0 6px 6px 0;margin-left:0;padding-left:10px}
.bfh{display:block;width:100%;text-align:left;font:600 12.5px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:none;border:0;border-top:1px solid var(--line);padding:14px 0 8px;margin:6px 0 2px;cursor:pointer;min-height:32px}.bfh:first-child{border-top:0;margin-top:0;padding-top:2px}
.bw.hl{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft);border-radius:3px;text-decoration:underline 2px var(--accent);text-underline-offset:3px}
.bfnote{margin:0;padding:12px 14px;color:var(--ink)}
@media (max-width:860px){.bftext{max-height:calc(100vh - 340px);max-height:calc(100dvh - 340px)}}
.bsecs{margin:-2px 0 8px 40px}.bsecs>summary{cursor:pointer;font-size:12px;padding:3px 0}.bsecl{display:grid;gap:1px;margin-top:4px}.bsec{font-size:13px;padding:5px 8px;min-height:32px}
.handoff{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--page);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px}.handoff span{flex:1 1 220px}
.narrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1060px;margin:0 auto}
.narrow select{font:inherit;font-size:13px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:5px;padding:2px 4px}
body.withbar{padding-bottom:84px}
.w{border-radius:3px;transition:background-color .12s}
.w.hl{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.chmap{display:flex;flex-wrap:wrap;gap:0;list-style:none;padding:0;margin:0 0 10px;font-size:13px;font-family:var(--mono);color:var(--muted)}
.chmap li{display:flex;align-items:center}
.chmap li+li::before{content:"›";margin:0 8px;color:var(--line)}
.chmap li.now{color:var(--accent);font-weight:600}.chmap li.done{color:var(--ink)}
.lessonintro{font-size:15px;color:var(--muted);background:var(--soft);border-radius:8px;padding:9px 13px;margin:6px 0 16px;max-width:none}
.tophead{max-width:1060px;margin:0 auto;padding-inline:18px;padding-block:10px 0}
.topbar{font-size:13.5px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{order:1!important;position:static;max-height:none;overflow:visible}.page{padding:20px 16px 24px}
 #narbar .narrow{gap:8px}#narlabel{display:none}#narbar.book #narlabel{display:block;flex-basis:100%;order:-1;font-size:12px}#narplay{padding:8px 14px}}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.fold summary::-webkit-details-marker{display:none}
.fold summary h3{margin:0}
.fold summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px;margin-left:auto}
.fold[open] summary::after{content:"\2212"}
.fold[open] summary{margin-bottom:10px}
.foldnote{font-size:12px}.fold[open] .foldnote{display:none}
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.castcard{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.castcard[disabled]{opacity:.5;cursor:default}.castcard b{display:block}
.av{position:relative;flex:none;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:hsl(var(--avh) 35% 30%);color:#f3f1ec;font-family:var(--story);font-weight:600}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av span{font-size:1.1em}
.castcard .av span{font-size:22px}.castquote{font-family:var(--story);font-style:italic;font-size:20px;border-left:4px solid var(--accent);margin:14px 0;padding:4px 14px}
.casthead{display:flex;gap:16px;align-items:center;margin:8px 0}.casthead .av span{font-size:40px}
.locked h2{color:var(--muted)}.ties{padding-left:20px}
.topnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.navl,.navr{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.navbtn{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:none;border:1px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer;text-decoration:none}
.navbtn:hover{background:var(--soft)}.navbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.navbtn.cont{background:var(--accent);color:var(--on-accent);font-weight:600}
.backlink{margin:0 0 10px}
.hero{display:grid;gap:4px;width:100%;text-align:left;font:inherit;color:var(--on-accent);background:var(--accent);border:none;border-radius:12px;padding:16px 18px;margin:12px 0 16px;cursor:pointer}
.hero .prog{color:inherit;opacity:.85}.hero b{font-family:var(--story);font-size:22px;font-weight:600}.hero .go{font-weight:600}
.nextstep{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:8px}.nextstep p{margin:4px 0 8px}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ctile{display:grid;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ctile:hover{border-color:var(--accent)}.ctile .cn{font-family:var(--mono);font-size:12px;color:var(--muted)}.ctile .ct{font-weight:600;font-size:15px}.ctile .cs{font-size:12.5px;color:var(--muted)}
.ctile.done{border-color:var(--good)}.ctile.done .cs{color:var(--good)}.ctile.prog{border-color:var(--accent)}.ctile.prog .cs{color:var(--accent)}
h2 .prog{font-family:var(--ui);font-size:13px;font-weight:400;margin-left:6px}
.mockhome p{margin:0 0 10px}.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.qlink{display:grid;gap:2px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.edtoggle{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:12px 0}

.recap.open .rcpre{visibility:hidden}.rcact{flex:0 0 auto;margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:underline}
.rcbody{padding:0 16px 12px}.rcbody p{margin:0 0 10px;font-family:var(--story);font-size:17px;line-height:1.55;color:var(--ink);max-width:68ch}
@media (max-width:520px){.rchead{flex-wrap:wrap;gap:2px 10px}.rct{max-width:none}.rcpre{order:3;flex-basis:100%}.recap.open .rcpre{display:none}}
.rnote{border:1px solid var(--line);border-radius:8px;background:var(--page);padding:10px 14px 12px;margin:0 0 14px;box-shadow:inset 3px 0 0 var(--muted)}
.rnk{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rnote .rnh{font-family:var(--ui);font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin:2px 0 6px}
.rnote p{margin:0 0 6px;font-size:15px;color:var(--ink)}.rnote .btn{margin:4px 0 0;min-height:32px}
.rback{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--soft);padding:8px 12px;margin:0 0 14px;font-size:15px;color:var(--ink)}.rback span{flex:1 1 200px}.rback .btn{margin:0;min-height:32px}
.wpanel:focus{outline:none}
.wherecard{display:grid;gap:6px;justify-items:start}.wherecard .btn{margin:0;min-height:32px}.whereline{margin:0;color:var(--ink);overflow-wrap:anywhere}
.wback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4)}
.wpanel{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(440px,100vw);overflow-y:auto;overscroll-behavior:contain;background:var(--page);color:var(--ink);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){.wpanel{top:auto;left:0;width:auto;max-height:86vh;max-height:86dvh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}}
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.whead h2{margin:0;font-size:20px}.whead h2:focus{outline:none}.whead h2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.whead .btn{margin:0;min-height:36px}
.where{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink);background:var(--soft);border-radius:6px;padding:8px 10px;margin:0 0 12px;overflow-wrap:anywhere}
.wpanel .wsub{margin:16px 0 6px;color:var(--muted)}
.wshort p,.wfull p{margin:0 0 8px;font-family:var(--story);font-size:17px;line-height:1.5}.wfull{border-left:3px solid var(--line);padding-left:10px;margin-top:6px}
.wmore{display:inline-flex;align-items:center;min-height:32px;font-size:14.5px}
.wwho{list-style:none;margin:0;padding:0;display:grid;gap:10px}.wwho li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.wwho b{display:block;font-size:15px}.wwl{display:block;font-size:14px;line-height:1.4;color:var(--muted)}
@media print{.rback,.recap,.rnote,.wherebtn,.wherecard,.wpanel,.wback{display:none!important}}
