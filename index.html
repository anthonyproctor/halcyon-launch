<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16303f">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halcyon">
<title>The Halcyon Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a book page for the story, a slim instrument rail for the meters. Reading first, UI second. */
:root{
  --bg:#f3f1ec; --page:#fbfaf7; --ink:#1d2024; --muted:#5d636b; --line:#dcd8cf; --soft:#ece9e2;
  --accent:#28536b; --accent-soft:#e1ebf0; --on-accent:#ffffff;
  --good:#2e7350; --good-soft:#e2f0e7; --mid:#9a6a12; --mid-soft:#f6ecd8; --bad:#a63c32; --bad-soft:#f5e1de;
  --mid-ink:#835a0e; --bubble:#2569c9; --on-bubble:#ffffff; /* text colors that hold 4.5:1: the "Partial" pill on --mid-soft, white on a text bubble */
  --story:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Inter Tight",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c;
  --mid-ink:#e0b25c; --bubble:#2563c4; --on-bubble:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c;
  --mid-ink:#e0b25c; --bubble:#2563c4; --on-bubble:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:1060px;margin:0 auto;padding-inline:18px;padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.page{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:28px clamp(18px,4vw,44px) 30px;min-width:0}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--story);font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
h2{font-family:var(--story);font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.2;margin:4px 0 14px;text-wrap:balance}
.story{font-family:var(--story);font-size:clamp(18px,2.1vw,20px);line-height:1.62;max-width:64ch}
.story p{margin:0 0 14px}
.story .said{font-style:italic}
.choices{display:grid;gap:10px;margin:20px 0 6px}
.choice{font:inherit;text-align:left;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.choice.best{border-color:var(--good)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outcome{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.verdict{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px;margin-bottom:10px}
.v3{color:var(--good);background:var(--good-soft)} .v1{color:var(--mid-ink);background:var(--mid-soft)} .v0{color:var(--bad);background:var(--bad-soft)}
.mentor{background:var(--soft);border-radius:8px;padding:14px 16px;margin:14px 0}
.mentor .who{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mentor .story{font-size:17.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.tag.dom{color:var(--accent);border-color:var(--accent)}
.tag.pre{color:var(--accent);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:7px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:13px;padding:6px 11px;font-weight:500}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px;min-width:0}
/* the side rail scrolls on its own when it's taller than the window (desktop only; the 860px rule below makes it static) */
.rail{max-height:calc(100vh - env(safe-area-inset-top,0px) - 32px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;align-content:start}
body:has(#narbar:not([hidden])) .rail{padding-bottom:var(--narbar-h,112px)}
.card{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.meter{margin-bottom:11px}
.meter .row{display:flex;justify-content:space-between;font-size:14px}
.meter .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.track span{display:block;height:100%;border-radius:4px}
/* book progress (2026-10-12): the rail card, the Library card bar, the Progress page finish line. Fill is --accent on --soft (3:1 or better as a graphic in both themes); text is --ink */
.bpbar{display:block;height:8px;background:var(--soft);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bpbar span{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:0}
.bpbar.thin{height:6px}
.bookbar{padding:12px 14px}.bookbar h3{margin-bottom:8px}
.bpline{margin:7px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.libbp{display:grid;gap:3px;margin-top:4px;max-width:280px}.libbp .prog{color:var(--ink)}
.bpline .bpp{white-space:nowrap}
h2.finishh{margin-top:18px}
.finish{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px;counter-reset:fin}
.finish li{counter-increment:fin;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.finish li::before{content:counter(fin);grid-row:1 / span 2;align-self:start;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line);color:var(--ink)}
.finish li.now::before{border-color:var(--accent);color:var(--accent)}
.finish li.done::before{content:"✓";background:var(--good-soft);border-color:var(--good);color:var(--good)}
.finish .fh{font-weight:600}.finish .fv{color:var(--ink)}
/* badges and readiness (2026-10-13): the Progress page's readiness card and badge shelf, and the badge toast. Badge art keeps its own
   colors in both themes (a patch or a stamp is an object); locked and hidden frames are drawn in currentColor, which is --muted here */
.readycard{margin:0 0 14px;padding:16px 18px}
.rdtop{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.rdtop h2{margin:0;font-size:20px}
.rdval{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1;color:var(--ink)}
.rdval.none{font-family:var(--ui);font-size:16px;font-weight:600;color:var(--muted)}
.rdbar{position:relative;display:block;height:10px;margin:12px 0 10px;background:var(--soft);border:1px solid var(--line);border-radius:6px}
.rdbar span{display:block;height:100%;background:var(--accent);border-radius:5px}
.rdbar i{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.rdtarget{margin:0 0 4px;font-size:15px}.rdhow{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--muted)}
.rdparts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0 0 10px}.rdparts div{display:flex;flex-direction:column}
.rdparts dt{font-size:12.5px;color:var(--muted)}.rdparts dd{margin:0;font-family:var(--mono);font-size:15px;color:var(--ink)}
.rdfoot{margin:0;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.shelf{margin:24px 0 8px}.shelf h2{margin-bottom:2px}
.shsub{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.shgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.bdg{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted)}
.bdg .bdgart{display:block}.bdg.got{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.bname{font-size:14.5px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.bline{font-size:13px;line-height:1.4;color:var(--ink)}.bdg.locked .bline,.bdg.hidden .bline{color:var(--muted)}
.bdate{font-size:12px;color:var(--muted)}
.shchips{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.bdg.chl{display:block;padding:4px;border-style:dashed}.bdg.chl .bdgart{width:40px;height:40px}
.toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none} /* never in the way of a tap */
body.withbar .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.tcard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;width:100%;max-width:380px;background:var(--page);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px 14px;opacity:0;transform:translateY(8px)}
.tcard.on{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){.tcard{transition:opacity .25s ease,transform .25s ease}}
.ttxt{display:flex;flex-direction:column;min-width:0}.tkick{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tname{font-size:15px;line-height:1.3}.tline{font-size:13px;line-height:1.4}
/* the private profile page (#me, 2026-10-14): the ID card header, the name form, the picture picker, stats and a card per book.
   The ID cards keep their own colors in both themes (a badge or a business card is an object, like the badge art). Inside a card,
   sizes are in cqw (the card's own width), so one card works as the header at 390 and 1280 and as a picker thumbnail. */
.mebtn{max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehead{display:grid;gap:18px;align-items:center}
@media (min-width:980px){.mehead{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px}}
.mecap{font-size:13px;color:var(--muted);margin:10px 2px 0}
.metxt{min-width:0}.metxt h1.mename{margin:4px 0 12px;overflow-wrap:anywhere}
.meacts{display:flex;flex-wrap:wrap;gap:8px}
.mepriv{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;color:var(--muted);margin:14px 0 0}
.mepriv svg{flex:none;width:16px;height:16px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meform label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
.merow{display:flex;flex-wrap:wrap;gap:8px}
.merow input{flex:1 1 140px;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.merow input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.meerr{color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:6px 10px;font-size:14px;margin:8px 0 0}.meerr:empty{display:none}
#menote{font-size:13px;margin:6px 0 0}
/* the cards */
.idwrap{container-type:inline-size;width:100%;max-width:440px}
.idcard{position:relative;aspect-ratio:1.586;border-radius:4.4cqw;overflow:hidden;display:flex;flex-direction:column;gap:2.4cqw;padding:5cqw 5.6cqw 4.4cqw;font-family:var(--ui);line-height:1.15;isolation:isolate;
  box-shadow:0 1px 2px rgb(0 0 0/.16),0 12px 30px -12px rgb(0 0 0/.5)}
.idcard::before{content:"";position:absolute;pointer-events:none;z-index:-1}
.idcard svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.idtop{display:flex;align-items:center;gap:2cqw;font-size:2.8cqw;letter-spacing:.14em;text-transform:uppercase;font-weight:600;white-space:nowrap;min-width:0}
.idlogo{width:6.6cqw;height:6.6cqw;flex:none}
.idmain{flex:1;display:flex;align-items:center;gap:5cqw;min-height:0}
.idphoto{position:relative;flex:none;width:23cqw;aspect-ratio:4/5;border-radius:2cqw;overflow:hidden;display:grid;place-items:center}
.idphoto .idimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.idini{font-family:var(--story);font-size:9.6cqw;font-weight:600;letter-spacing:.02em}
.idcard .idsil{width:72%;margin-top:22%;fill:currentColor;stroke:none;opacity:.55}
.idtxt{display:flex;flex-direction:column;gap:1.3cqw;min-width:0}
.idname{font-family:var(--story);font-size:7.2cqw;font-weight:600;line-height:1.06;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idblank{opacity:.6;font-style:italic;font-weight:500}
.idrole{font-family:var(--mono);font-size:2.9cqw;letter-spacing:.13em;text-transform:uppercase}
.idno{font-family:var(--mono);font-size:2.6cqw;letter-spacing:.08em;opacity:.85}
.idfoot{display:flex;align-items:center;justify-content:space-between;gap:3cqw;font-family:var(--mono);font-size:2.6cqw;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
/* PMP: the Halcyon program badge, navy and gold, a lanyard slot, a row of patch slots */
.id-pmp{background:radial-gradient(120% 95% at 88% -5%,#33508a 0%,#1f2f55 46%,#121c37 100%);color:#efe6c8;padding-top:7.4cqw}
.id-pmp::before{inset:2.2cqw;border:.45cqw solid rgb(201 163 58/.7);border-radius:3cqw}
.id-pmp::after{content:"";position:absolute;top:2.9cqw;left:50%;width:15cqw;height:2.2cqw;margin-left:-7.5cqw;border-radius:2cqw;background:#0b1229;box-shadow:inset 0 .4cqw .8cqw rgb(0 0 0/.7),0 .2cqw 0 rgb(255 255 255/.12)}
.id-pmp .idtop{color:#d4b158;font-size:2.4cqw}.id-pmp .idlogo{color:#d4b158}
.iddot{width:1cqw;height:1cqw;border-radius:50%;background:currentColor;opacity:.7;flex:none}
.id-pmp .idphoto{background:linear-gradient(160deg,#2b3f70,#1a2748);color:#f1dc9a;box-shadow:0 0 0 .55cqw #c9a33a}
.idprog{font-family:var(--mono);font-size:2.9cqw;letter-spacing:.24em;text-transform:uppercase;color:#d4b158}
.id-pmp .idname{color:#fbf3dc}.id-pmp .idrole{color:#f1dc9a}
.id-pmp .idfoot{color:#e7cf86;border-top:.3cqw solid rgb(201 163 58/.45);padding-top:2.4cqw}
.idslots{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.9cqw}
.idslots i{display:block;width:2.5cqw;height:2.5cqw;border-radius:50%;box-shadow:inset 0 0 0 .35cqw #c9a33a;opacity:.8}.idslots i.on{background:#c9a33a;opacity:1}
/* CISA: the Vellacott card, Henry's business card, with Dot's green ticks */
.id-cisa{background:#f7f1df linear-gradient(180deg,rgb(255 255 255/.55),rgb(255 255 255/0) 45%);color:#1d2836;gap:1cqw}
.id-cisa::before{inset:2.6cqw;border:.25cqw solid #c9bc97;border-radius:2cqw}
.id-cisa .idtop{color:#22344d;gap:2.4cqw}.id-cisa .idlogo{width:7.6cqw;height:7.6cqw;color:#2b4569}
.id-cisa .idorg{font-family:var(--story);font-size:4.2cqw;letter-spacing:.32em;font-weight:600}
.id-cisa .idphoto{margin-left:auto;width:12.5cqw;aspect-ratio:1;border-radius:50%;background:#e9dfc4;color:#2b4569;box-shadow:0 0 0 .3cqw #c9bc97}.id-cisa .idphoto .idini{font-size:5cqw}
.id-cisa .idmain{justify-content:center;text-align:center}.id-cisa .idtxt{align-items:center;gap:2cqw}
.id-cisa .idname{font-size:7.6cqw;font-weight:500;letter-spacing:.01em;color:#141c27}
.id-cisa .idrole{color:#5b6472;font-size:2.6cqw;letter-spacing:.3em}
.id-cisa .idfoot{font-family:var(--story);text-transform:none;letter-spacing:.01em;font-size:2.8cqw;color:#47505d;align-items:flex-end}
.idaddr{display:flex;flex-direction:column;gap:.7cqw}
.idticks{display:grid;grid-template-columns:repeat(6,3.4cqw);gap:1cqw 1.1cqw}
.idticks i{display:block;width:3.4cqw;height:3.4cqw;border-radius:50%;background:rgb(47 125 74/.1)}
.idticks i.on{background:none}.idticks i.on::after{content:"";display:block;width:1.5cqw;height:2.7cqw;margin:-.2cqw auto 0;border:solid #2f7d4a;border-width:0 .55cqw .55cqw 0;transform:rotate(42deg)}
/* the pilot: your own logbook, blue leatherette, a stitched edge, a name plate with the first entry and total time */
.id-pilot{background:radial-gradient(140% 120% at 20% 0%,#2a3d62 0%,#1b2a46 55%,#131e33 100%);color:#d9b968;gap:2.6cqw}
.id-pilot::before{inset:2.4cqw;border:.35cqw dashed rgb(217 185 104/.5);border-radius:3cqw}
.id-pilot .idtop{justify-content:space-between}
.idfoil{font-family:var(--story);font-size:4.8cqw;letter-spacing:.2em;font-weight:600;color:#e2c477;text-shadow:0 .2cqw 0 rgb(0 0 0/.35)}
.id-pilot .idlogo{width:13cqw;height:6.5cqw;color:#d9b968}
.id-pilot .idphoto{width:17cqw;aspect-ratio:1;border-radius:50%;background:#2a3d62;color:#e2c477;box-shadow:0 0 0 .5cqw #d9b968}.id-pilot .idphoto .idini{font-size:6.4cqw}
.idplate{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:.6cqw;background:#f2ead6;color:#24508f;border-radius:1.6cqw;padding:2.4cqw 3.6cqw;box-shadow:inset 0 0 0 .35cqw #b9a57e,0 .5cqw 1.2cqw rgb(0 0 0/.35)}
.id-pilot .idname{font-style:italic;font-weight:500;font-size:6.6cqw;color:#1f4a87}
.idlbl{font-family:var(--mono);font-size:2.2cqw;letter-spacing:.12em;text-transform:uppercase;color:#7a6a48;font-style:normal}
.idrule{display:block;height:.25cqw;background:#b9a57e;margin:.2cqw 0 .9cqw}

.rcbody{padding:0 16px 12px}.rcbody p{margin:0 0 10px;font-family:var(--story);font-size:17px;line-height:1.55;color:var(--ink);max-width:68ch}
@media (max-width:520px){.rchead{flex-wrap:wrap;gap:2px 10px}.rct{max-width:none}.rcpre{order:3;flex-basis:100%}.recap.open .rcpre{display:none}}
.rnote{border:1px solid var(--line);border-radius:8px;background:var(--page);padding:10px 14px 12px;margin:0 0 14px;box-shadow:inset 3px 0 0 var(--muted)}
.rnk{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rnote .rnh{font-family:var(--ui);font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin:2px 0 6px}
.rnote p{margin:0 0 6px;font-size:15px;color:var(--ink)}.rnote .btn{margin:4px 0 0;min-height:32px}
.rback{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--soft);padding:8px 12px;margin:0 0 14px;font-size:15px;color:var(--ink)}.rback span{flex:1 1 200px}.rback .btn{margin:0;min-height:32px}
.wpanel:focus{outline:none}
.wherecard{display:grid;gap:6px;justify-items:start}.wherecard .btn{margin:0;min-height:32px}.whereline{margin:0;color:var(--ink);overflow-wrap:anywhere}
.wback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4)}
.wpanel{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(440px,100vw);overflow-y:auto;overscroll-behavior:contain;background:var(--page);color:var(--ink);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){.wpanel{top:auto;left:0;width:auto;max-height:86vh;max-height:86dvh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}}
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.whead h2{margin:0;font-size:20px}.whead h2:focus{outline:none}.whead h2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.whead .btn{margin:0;min-height:36px}
.where{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink);background:var(--soft);border-radius:6px;padding:8px 10px;margin:0 0 12px;overflow-wrap:anywhere}
.wpanel .wsub{margin:16px 0 6px;color:var(--muted)}
.wshort p,.wfull p{margin:0 0 8px;font-family:var(--story);font-size:17px;line-height:1.5}.wfull{border-left:3px solid var(--line);padding-left:10px;margin-top:6px}
.wmore{display:inline-flex;align-items:center;min-height:32px;font-size:14.5px}
.wwho{list-style:none;margin:0;padding:0;display:grid;gap:10px}.wwho li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.wwho b{display:block;font-size:15px}.wwl{display:block;font-size:14px;line-height:1.4;color:var(--muted)}
@media print{.rback,.recap,.rnote,.wherebtn,.wherecard,.wpanel,.wback{display:none!important}}
/* bookmarks and notes (2026-10-12): a small toggle at the end of the Contents row and in the Audiobook text header, a one line row under it, My notes */
.bmbtn{flex:0 0 auto;display:inline-grid;place-items:center;width:32px;height:32px;margin:0 0 0 auto;padding:0;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.bmbtn svg path{fill:none}.bmbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.bmbtn[aria-pressed="true"] svg path{fill:currentColor}
.bmbtn:hover{border-color:var(--accent)}
.bmrow{margin:-8px 0 14px;font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}.bmrow[hidden]{display:none}
.bmrow .linkbtn{font-size:14px}.bmnoteline{color:var(--ink)}
.bmform{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.bminput{font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;min-width:0;box-sizing:border-box}
.bminput:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bmform .bmrev{flex:1 1 auto;min-height:24px}.bmformbtns{display:flex;align-items:center;gap:12px}.bmformbtns .btn.small{margin:0}
.bmrev input,.bmacts input{width:18px;height:18px;margin:0}
.bfhead{display:flex;align-items:flex-start;gap:10px}.bfhead>div{flex:1 1 auto;min-width:0}.bfhead .bmbtn{background:var(--page)}.bfhead .bmbtn[aria-pressed="true"]{background:var(--accent-soft)}
.bfollow>.bmrow{margin:0;padding:8px 14px;border-bottom:1px solid var(--line)}
.notescard{padding:10px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.notescard[hidden]{display:none}#bmbody{margin-bottom:24px}.notescard .linkbtn{font-size:14px}
.bmlink{margin:4px 0 18px}ol.plan li{overflow-wrap:anywhere}
.bmbook h2 .prog{font-weight:400}.bmch{font-size:15px;margin:16px 0 8px}
.bmlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bmitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.bmtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}.bmtop .linkbtn{text-align:left;font-size:15px;overflow-wrap:anywhere}
.bmacts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}.bmacts .chk{min-height:24px}
.bmstatus{min-height:0;font-size:14px;color:var(--ink)}.bmstatus:not(:empty){margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
@media print{.bmbtn,.bmrow,.notescard{display:none!important}}
