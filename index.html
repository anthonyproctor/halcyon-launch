<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16303f">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halcyon">
<title>The Halcyon Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a book page for the story, a slim instrument rail for the meters. Reading first, UI second. */
:root{
  --bg:#f3f1ec; --page:#fbfaf7; --ink:#1d2024; --muted:#5d636b; --line:#dcd8cf; --soft:#ece9e2;
  --accent:#28536b; --accent-soft:#e1ebf0; --on-accent:#ffffff;
  --good:#2e7350; --good-soft:#e2f0e7; --mid:#9a6a12; --mid-soft:#f6ecd8; --bad:#a63c32; --bad-soft:#f5e1de;
  --story:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Inter Tight",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --page:#1a1d21; --ink:#e7e5e0; --muted:#a0a5ab; --line:#2e3238; --soft:#23272c;
  --accent:#8dbcd4; --accent-soft:#1f3340; --on-accent:#121417;
  --good:#74c69a; --good-soft:#1b3326; --mid:#e0b25c; --mid-soft:#382c15; --bad:#ec8b80; --bad-soft:#3d201c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:1060px;margin:0 auto;padding-inline:18px;padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.page{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:28px clamp(18px,4vw,44px) 30px;min-width:0}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--story);font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
h2{font-family:var(--story);font-weight:600;font-size:clamp(22px,3vw,28px);line-height:1.2;margin:4px 0 14px;text-wrap:balance}
.story{font-family:var(--story);font-size:clamp(18px,2.1vw,20px);line-height:1.62;max-width:64ch}
.story p{margin:0 0 14px}
.story .said{font-style:italic}
.choices{display:grid;gap:10px;margin:20px 0 6px}
.choice{font:inherit;text-align:left;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px}
.choice[disabled]{cursor:default;opacity:.55}
.choice.picked{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.choice.best{border-color:var(--good)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outcome{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.verdict{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px;margin-bottom:10px}
.v3{color:var(--good);background:var(--good-soft)} .v1{color:var(--mid);background:var(--mid-soft)} .v0{color:var(--bad);background:var(--bad-soft)}
.mentor{background:var(--soft);border-radius:8px;padding:14px 16px;margin:14px 0}
.mentor .who{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mentor .story{font-size:17.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.tag.dom{color:var(--accent);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:7px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:13px;padding:6px 11px;font-weight:500}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px;min-width:0}
.card{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.meter{margin-bottom:11px}
.meter .row{display:flex;justify-content:space-between;font-size:14px}
.meter .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.track span{display:block;height:100%;border-radius:4px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.dom-row:last-child{border-bottom:none}
.prog{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dot{width:14px;height:6px;border-radius:3px;background:var(--soft)}
.dot.s3{background:var(--good)} .dot.s1{background:var(--mid)} .dot.s0{background:var(--bad)} .dot.now{background:var(--accent)}
.cast dt{font-weight:600;font-size:14px;margin-top:8px}
.cast dd{margin:0;font-size:13.5px;color:var(--muted)}
.end-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.end-grid .card{padding:12px}
.big{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums}
.auth{max-width:420px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);margin-bottom:12px}
.auth input{font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.auth .err{color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:8px 11px;font-size:14px;margin-bottom:12px}
.userbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px}
.linkbtn{font:inherit;font-size:13.5px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.plan{padding-left:20px;font-size:16px}.plan li{margin:8px 0}
.btn.small{font-size:13px;padding:5px 10px;margin-left:6px}
.helpcard{margin:10px 0}.helpcard .row{display:flex;justify-content:space-between;gap:8px}
.taskgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.taskcell{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;font-size:13px;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.taskcell .tc{font-family:var(--mono);font-size:12px;color:var(--accent)}.taskcell .tn{font-weight:500;min-height:2.6em}
.mbar{display:block;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:2px 0}.mbar span{display:block;height:100%}
#narbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--page);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nartrack{height:3px;background:var(--soft);margin:0 -16px 8px}.nartrack span{display:block;height:100%;width:0;background:var(--accent)}
.narrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1060px;margin:0 auto}
.narrow select{font:inherit;font-size:13px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:5px;padding:2px 4px}
body.withbar{padding-bottom:84px}
.w{border-radius:3px;transition:background-color .12s}
.w.hl{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.chmap{display:flex;flex-wrap:wrap;gap:0;list-style:none;padding:0;margin:0 0 10px;font-size:13px;font-family:var(--mono);color:var(--muted)}
.chmap li{display:flex;align-items:center}
.chmap li+li::before{content:"›";margin:0 8px;color:var(--line)}
.chmap li.now{color:var(--accent);font-weight:600}.chmap li.done{color:var(--ink)}
.lessonintro{font-size:15px;color:var(--muted);background:var(--soft);border-radius:8px;padding:9px 13px;margin:6px 0 16px;max-width:none}
.tophead{max-width:1060px;margin:0 auto;padding-inline:18px;padding-block:10px 0}
.topbar{font-size:13.5px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{order:1!important;position:static}.page{padding:20px 16px 24px}
 #narbar .narrow{gap:8px}#narlabel{display:none}#narplay{padding:8px 14px}}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.fold summary::-webkit-details-marker{display:none}
.fold summary h3{margin:0}
.fold summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px;margin-left:auto}
.fold[open] summary::after{content:"\2212"}
.fold[open] summary{margin-bottom:10px}
.foldnote{font-size:12px}.fold[open] .foldnote{display:none}
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.castcard{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.castcard[disabled]{opacity:.5;cursor:default}.castcard b{display:block}
.av{position:relative;flex:none;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:hsl(var(--avh) 35% 35%);color:#f3f1ec;font-family:var(--story);font-weight:600}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av span{font-size:1.1em}
.castcard .av span{font-size:22px}.castquote{font-family:var(--story);font-style:italic;font-size:20px;border-left:4px solid var(--accent);margin:14px 0;padding:4px 14px}
.casthead{display:flex;gap:16px;align-items:center;margin:8px 0}.casthead .av span{font-size:40px}
.locked h2{color:var(--muted)}.ties{padding-left:20px}
.stepnav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.sdot{width:16px;height:8px;border-radius:4px;border:none;background:var(--soft);padding:0;cursor:pointer}
.sdot.seen{background:var(--accent-soft)} .sdot.now{background:var(--accent)} .sdot[disabled]{cursor:default}
.lesson{margin-bottom:18px}
.terms{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 14px;background:var(--soft);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:15px}
.terms dt{font-weight:600}.terms dd{margin:0}
@media (max-width:560px){.terms{grid-template-columns:minmax(0,1fr)}.terms dd{margin-bottom:6px}}
.examtip{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:9px 13px;margin:8px 0;font-size:15px}
.drill label{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;margin:10px 0}
.drill input,.exitem select{font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:200px}
.tablewrap{overflow-x:auto;margin:10px 0}.tablewrap table{border-collapse:collapse;font-size:14px;min-width:360px}.tablewrap th,.tablewrap td{border:1px solid var(--line);padding:6px 9px;text-align:left}.tablewrap th{background:var(--soft)}
.exitem{border-bottom:1px dashed var(--line);padding:10px 0}.exitem p{margin:0 0 6px}
.qitem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.qitem legend{font-family:var(--story);font-size:18px;line-height:1.5;padding:0 4px}
.qopt{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:15.5px}
.qopt:hover{background:var(--soft)}.qopt .k{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.qright{background:var(--good-soft);color:var(--ink)}.qwrong{background:var(--bad-soft);color:var(--ink)}
.qwhy{font-size:15px;background:var(--soft);border-radius:6px;padding:9px 12px;margin:8px 0 0}
.callout{background:var(--page);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;margin:14px 0}
.navgrid{margin:14px 0}.navgrid summary{cursor:pointer;font-size:14px;color:var(--muted)}
.navgrid div{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.nq{font:12px var(--mono);width:34px;padding:4px 0;border:1px solid var(--line);border-radius:4px;background:var(--page);color:var(--ink);cursor:pointer}
.nq.done{background:var(--accent-soft)}.nq.flag{border-color:var(--mid);box-shadow:inset 0 -3px 0 var(--mid)}.nq.now{outline:2px solid var(--accent)}
.tracks,.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.track p{margin:6px 0}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
.chaprow{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line)}
.chaprow:last-child{border-bottom:none}
.chaprow .chap{border-bottom:none;flex:1;min-width:0}
.chaprow .reset{font-size:12px;color:var(--muted)}
.chap{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;font:inherit;font-size:14px;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:6px 0;color:var(--ink);cursor:pointer}
.chap:last-child{border-bottom:none}
.chap .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chap.cur{color:var(--accent);font-weight:600}
.chap[disabled]{color:var(--muted);cursor:default}
.video{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--page)}
.video .vhead{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:14px;flex-wrap:wrap}
.video .vhead b{font-weight:600}
.video .vframe{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.video .vframe iframe,.video .vframe button{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .vframe button{cursor:pointer;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.video .play{font:600 15px var(--ui);color:#fff;background:rgba(0,0,0,.65);border-radius:999px;padding:9px 16px}
.episode{background:var(--soft);border-radius:8px;padding:12px 14px;margin:16px 0}
.episode audio{width:100%;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.track span{transition:width .4s ease}.outcome{animation:rise .35s ease}}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="tophead"><div class="topbar" id="usercard" hidden><div class="userbar"><span id="username"></span><span><button class="linkbtn" id="homelink" type="button">Home</button> · <button class="linkbtn" id="proglink" type="button">Progress</button> · <button class="linkbtn" id="castlink" type="button">Cast</button> · <a id="adminlink" href="/admin" hidden>Admin</a> <button class="linkbtn" id="signout" type="button">Sign out</button></span></div></div></header>
<div class="wrap">
  <main class="page" id="page" aria-live="polite"></main>
  <aside class="rail" aria-label="Status">

    <div class="card" id="mockcard" hidden></div>
    <div id="railgame">
    <div class="card">
      <h3>Project state</h3>
      <div id="meters"></div>
      <div class="prog" id="prog"></div>
      <div class="dots" id="dots"></div>
    </div>
    <details class="card fold" id="fold-areas" open>
      <summary><h3>Exam areas</h3></summary>
      <div id="domains"></div>
      <p class="prog" style="margin:8px 0 0">This chapter, then all chapters. Decisions and quizzes count.</p>
    </details>
    <details class="card fold" id="fold-chapters" open>
      <summary><h3 id="trackname">Chapters</h3><span class="prog foldnote" id="chnote"></span></summary>
      <div id="chapters"></div>
    </details>
    <details class="card fold" id="fold-cast">
      <summary><h3>Cast</h3><span class="prog foldnote">tap to open</span></summary>
      <dl class="cast" style="margin:0" id="cast"></dl>
    </details>
    </div>
  </aside>
</div>

<script src="full/ch10.js"></script>

<script src="full/ch12.js"></script>

<script src="full/ch14.js"></script>
<script src="full/ch15.js"></script>
