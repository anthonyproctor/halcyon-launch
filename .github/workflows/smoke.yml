name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # the first run after new audio downloads it from R2; later runs use the cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg   # ffprobe, used by the follow-along tests
      - uses: actions/cache/restore@v6.1.0
        id: audio
        with:
          path: |
            audio/**/*.mp3
            courses/*/audio/**/*.mp3
            courses/*/cast/voice/*.mp3
            cast/**/*.mp3
            voice-samples/*.mp3
          key: r2-audio-${{ hashFiles('audio-manifest.json') }}
          restore-keys: r2-audio-
      - name: Pull the audio the tests play from R2 (cache first)
        run: >
          python3 tools/r2_sync.py --pull
          --match '^audio/(amb/|sting-)'
          --match '^audio/v2/(pages/f[12]s?/|full-ch0[12]\.mp3|story/full-ch0[12]\.mp3)'
          --match '^courses/(pilot|cisa)/audio/(pages/f1s?/|full-ch01\.mp3|story/full-ch01\.mp3)'
          --match '^courses/pilot/audio/pages/f[2-4]s?/'
          --match '/cast/|^cast/|^voice-samples/'
      - uses: actions/cache/save@v6.1.0   # saved right after the pull, so a failing test run still keeps the audio
        if: always() && steps.audio.outputs.cache-hit != 'true'
        with:
          path: |
            audio/**/*.mp3
            courses/*/audio/**/*.mp3
            courses/*/cast/voice/*.mp3
            cast/**/*.mp3
            voice-samples/*.mp3
          key: r2-audio-${{ hashFiles('audio-manifest.json') }}
      - run: npm run test:smoke
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-results
          path: tests/test-results
          retention-days: 7
