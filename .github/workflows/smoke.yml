name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg   # ffprobe, used by the follow-along tests
      - uses: actions/cache@v6.1.0
        with:
          path: |
            audio
            courses/*/audio
            courses/*/cast/voice
            cast
            voice-samples
          key: r2-audio-${{ hashFiles('audio-manifest.json') }}
          restore-keys: r2-audio-
      - run: python3 tools/r2_sync.py --pull   # only fetches files the cache doesn't already have
      - run: npm run test:smoke
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-results
          path: tests/test-results
          retention-days: 7
